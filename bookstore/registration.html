
<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
        }

        table {
            margin: auto;
            border-spacing: 10px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 220px;
            padding: 5px;
        }

        select {
            padding: 5px;
        }

        .buttons {
            text-align: center;
        }
    </style>
</head>

<body>

<h2>Registration Form</h2>

<form onsubmit="return validateForm()">

    <table>

        <tr>
            <td>Name:</td>
            <td>
                <input type="text" id="name" required>
            </td>
        </tr>

        <tr>
            <td>Password:</td>
            <td>
                <input type="password" id="password" required>
            </td>
        </tr>

        <tr>
            <td>E-mail ID:</td>
            <td>
                <input type="email" name="email" required>
            </td>
        </tr>

        <tr>
            <td>Phone Number:</td>
            <td>
                <input type="text" name="phone"
                       maxlength="10" inputmode="numeric" required>
            </td>
        </tr>

        <tr>
            <td>Sex:</td>
            <td>
                <input type="radio" name="sex" value="Male"> Male
                <input type="radio" name="sex" value="Female"> Female
            </td>
        </tr>

        <tr>
            <td>Date of Birth:</td>
            <td>
                <select name="day">
                    <option value="">Day</option>
                    <script>
                        for (let i = 1; i <= 31; i++) {
                            document.write(
                                `<option value="${i}">${i}</option>`
                            );
                        }
                    </script>
                </select>

                <select name="month">
                    <option value="">Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>

                <select name="year">
                    <option value="">Year</option>
                    <script>
                        for (let i = 2026; i >= 1950; i--) {
                            document.write(
                                `<option value="${i}">${i}</option>`
                            );
                        }
                    </script>
                </select>
            </td>
        </tr>

        <tr>
            <td>Languages Known:</td>
            <td>
                <input type="checkbox" name="language" value="English">
                English
                <input type="checkbox" name="language" value="Telugu">
                Telugu
                <br>
                <input type="checkbox" name="language" value="Hindi">
                Hindi
                <input type="checkbox" name="language" value="Tamil">
                Tamil
            </td>
        </tr>

        <tr>
            <td>Address:</td>
            <td>
                <textarea name="address" rows="4"></textarea>
            </td>
        </tr>

        <tr>
            <td colspan="2" class="buttons">
                <input type="submit" value="Register">
                &nbsp;&nbsp;
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</form>

<script>
    function validateForm() {

        // Get the entered name
        let name = document.getElementById("name").value.trim();

        // Get the entered password
        let password =
            document.getElementById("password").value;

        // Name: alphabets and spaces, minimum 6 characters
        let namePattern = /^[A-Za-z ]{6,}$/;

        if (!namePattern.test(name)) {
            alert("Name must contain only alphabets and be at least 6 characters long.");
            return false;
        }

        // Password: minimum 6 characters
        if (password.length < 6) {
            alert("Password must be at least 6 characters long.");
            return false;
        }

        alert("Registration form validation successful!");
        return false;
    }
</script>

</body>
</html>
